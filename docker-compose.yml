services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: backlog_ia
      POSTGRES_PASSWORD: backlog_ia_dev
      POSTGRES_DB: backlog_ia
    ports:
      # 5433 en el host: el 5432 ya lo ocupa un Postgres nativo de esta máquina.
      - '5433:5432'
    volumes:
      - backlog_ia_pgdata:/var/lib/postgresql/data

volumes:
  backlog_ia_pgdata:

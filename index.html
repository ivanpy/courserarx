    <meta name="description" content="Transforms wireframes, screenshots, and meeting notes into validated executive proposals, agile technical backlogs, conflict alerts, and effort estimations." />

    <meta property="og:description" content="Transforms wireframes, screenshots, and meeting notes into validated executive proposals, agile technical backlogs, conflict alerts, and effort estimations." />

    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var currentFetch = nativeFetch;

            // 1. Ensure Window.prototype has a setter if fetch has only a getter
            if (typeof Window !== 'undefined' && Window.prototype) {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (protoDesc && protoDesc.get && !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch || (protoDesc.get ? protoDesc.get.call(this) : undefined);
                  },
                  set: function(fn) {
                    currentFetch = fn;
                    try {
                      Object.defineProperty(this, 'fetch', {
                        value: fn,
                        writable: true,
                        configurable: true,
                        enumerable: true
                      });
                    } catch (_) {}
                  }
                });
              }
            }

            // 2. Define writable/configurable fetch directly on window
            var winDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!winDesc || !winDesc.set || !winDesc.writable) {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                }
              });
            }
          }
        } catch (e) {
          console.warn('Fetch setter safeguard error:', e);
        }
      })();
    </script>
  </head>

  </body>
